global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: banking-microservices
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - api-gateway:9090
          - authentication-service:9090
          - account-service:9090
          - transaction-service:9090
          - payment-service:9090
          - fraud-detection-service:9090
          - notification-service:9090
        labels:
          environment: local

  - job_name: otel-collector
    metrics_path: /metrics
    static_configs:
      - targets:
          - otel-collector:8889
