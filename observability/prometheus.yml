global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Spring Boot Actuator Prometheus endpoints. Enable /actuator/prometheus in each
  # service's application configuration before expecting targets to become UP.
  - job_name: banking-microservices
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - api-gateway:8080
          - authentication-service:8086
          - account-service:8081
          - transaction-service:8082
          - payment-service:8083
          - fraud-detection-service:8084
          - notification-service:8085

  - job_name: otel-collector
    metrics_path: /metrics
    static_configs:
      - targets:
          - otel-collector:8889
