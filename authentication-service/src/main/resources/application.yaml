spring:
  application:
    name: authentication-service

  datasource:
    url: jdbc:mysql://localhost:3306/bank_user_db?createDatabaseIfNotExist=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
logging:
  pattern:
    console: ${LOG_PATTERN_CONSOLE:%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15})-%msg%n}

jwt:
  secret: my-super-secret-key-for-banking-application-123456
  expiration: 3600000

server:
  port: 8086