services:
  banking-frontend:
    image: ghcr.io/myselfsudhir/banking-frontend/banking-frontend:latest
    container_name: banking-frontend
    ports:
      - "3000:80"
    networks:
      - banking-network
    depends_on:
      - api-gateway

  authentication-service:
    image: ghcr.io/myselfsudhir/banking-project/authentication-service:latest
    container_name: authentication-service
    ports:
      - "8086:8086"
    networks:
      - banking-network
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DEPLOYMENT_ENVIRONMENT: local
      MYSQL_USERNAME: ${MYSQL_USERNAME:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_TRACES_SAMPLING_PROBABILITY: ${OTEL_TRACES_SAMPLING_PROBABILITY:-1.0}

  account-service:
    image: ghcr.io/myselfsudhir/banking-project/account-service:latest
    container_name: account-service
    ports:
      - "8081:8081"
    networks:
      - banking-network
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DEPLOYMENT_ENVIRONMENT: local
      MYSQL_USERNAME: ${MYSQL_USERNAME:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_TRACES_SAMPLING_PROBABILITY: ${OTEL_TRACES_SAMPLING_PROBABILITY:-1.0}

  payment-service:
    image: ghcr.io/myselfsudhir/banking-project/payment-service:latest
    container_name: payment-service
    ports:
      - "8083:8083"
    networks:
      - banking-network
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DEPLOYMENT_ENVIRONMENT: local
      MYSQL_USERNAME: ${MYSQL_USERNAME:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:?Set RAZORPAY_KEY_ID in .env}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:?Set RAZORPAY_KEY_SECRET in .env}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:?Set RAZORPAY_WEBHOOK_SECRET in .env}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_TRACES_SAMPLING_PROBABILITY: ${OTEL_TRACES_SAMPLING_PROBABILITY:-1.0}

  transaction-service:
    image: ghcr.io/myselfsudhir/banking-project/transaction-service:latest
    container_name: transaction-service
    ports:
      - "8082:8082"
    networks:
      - banking-network
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DEPLOYMENT_ENVIRONMENT: local
      MYSQL_USERNAME: ${MYSQL_USERNAME:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_TRACES_SAMPLING_PROBABILITY: ${OTEL_TRACES_SAMPLING_PROBABILITY:-1.0}

  fraud-detection-service:
    image: ghcr.io/myselfsudhir/banking-project/fraud-detection-service:latest
    container_name: fraud-detection-service
    ports:
      - "8084:8084"
    networks:
      - banking-network
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DEPLOYMENT_ENVIRONMENT: local
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_TRACES_SAMPLING_PROBABILITY: ${OTEL_TRACES_SAMPLING_PROBABILITY:-1.0}

  notification-service:
    image: ghcr.io/myselfsudhir/banking-project/notification-service:latest
    container_name: notification-service
    ports:
      - "8085:8085"
    networks:
      - banking-network
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DEPLOYMENT_ENVIRONMENT: local
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_TRACES_SAMPLING_PROBABILITY: ${OTEL_TRACES_SAMPLING_PROBABILITY:-1.0}

  api-gateway:
    image: ghcr.io/myselfsudhir/banking-project/api-gateway:latest
    container_name: api-gateway
    ports:
      - "8080:8080"
    networks:
      - banking-network
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DEPLOYMENT_ENVIRONMENT: local
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_TRACES_SAMPLING_PROBABILITY: ${OTEL_TRACES_SAMPLING_PROBABILITY:-1.0}

