apiVersion: apps/v1
kind: Deployment

metadata:
  name: authentication-service

spec:
  replicas: 2

  selector:
    matchLabels:
      app: authentication-service

  template:
    metadata:
      labels:
        app: authentication-service

    spec:
      containers:
        - name: authentication-service
          image: ghcr.io/myselfsudhir/banking-project/authentication-service:latest

          ports:
            - containerPort: 8086

          env:
            - name: SPRING_PROFILES_ACTIVE
              value: docker

---
apiVersion: v1
kind: Service

metadata:
  name: authentication-service

spec:
  selector:
    app: authentication-service

  ports:
    - port: 8086
      targetPort: 8086

  type: ClusterIP