apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service

spec:
  replicas: 2

  selector:
    matchLabels:
      app: payment-service

  template:
    metadata:
      labels:
        app: payment-service

    spec:
      containers:
        - name: payment-service
          image: ghcr.io/myselfsudhir/banking-project/payment-service:latest

          ports:
            - containerPort: 8083

          env:
            - name: SPRING_PROFILES_ACTIVE
              value: docker

---
apiVersion: v1
kind: Service
metadata:
  name: payment-service

spec:
  selector:
    app: payment-service

  ports:
    - port: 8083
      targetPort: 8083

  type: ClusterIP