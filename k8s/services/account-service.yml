apiVersion: apps/v1
kind: Deployment
metadata:
  name: account-service

spec:
  replicas: 2

  selector:
    matchLabels:
      app: account-service

  template:
    metadata:
      labels:
        app: account-service

    spec:
      containers:
        - name: account-service
          image: ghcr.io/myselfsudhir/banking-project/account-service:latest

          ports:
            - containerPort: 8081

          env:
            - name: SPRING_PROFILES_ACTIVE
              value: docker

---
apiVersion: v1
kind: Service
metadata:
  name: account-service

spec:
  selector:
    app: account-service

  ports:
    - port: 8081
      targetPort: 8081

  type: ClusterIP