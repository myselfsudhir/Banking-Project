apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service

spec:
  replicas: 2

  selector:
    matchLabels:
      app: notification-service

  template:
    metadata:
      labels:
        app: notification-service

    spec:
      containers:
        - name: notification-service
          image: ghcr.io/myselfsudhir/banking-project/notification-service:latest

          ports:
            - containerPort: 8085

          env:
            - name: SPRING_PROFILES_ACTIVE
              value: docker

---
apiVersion: v1
kind: Service
metadata:
  name: notification-service

spec:
  selector:
    app: notification-service

  ports:
    - port: 8085
      targetPort: 8085

  type: ClusterIP