apiVersion: apps/v1
kind: Deployment
metadata:
  name: transaction-service

spec:
  replicas: 2

  selector:
    matchLabels:
      app: transaction-service

  template:
    metadata:
      labels:
        app: transaction-service

    spec:
      containers:
        - name: transaction-service
          image: ghcr.io/myselfsudhir/banking-project/transaction-service:latest

          ports:
            - containerPort: 8082

          env:
            - name: SPRING_PROFILES_ACTIVE
              value: docker

---
apiVersion: v1
kind: Service
metadata:
  name: transaction-service

spec:
  selector:
    app: transaction-service

  ports:
    - port: 8082
      targetPort: 8082

  type: ClusterIP